# JiaRu 共享反向代理片段（2026-09-24 安全审计修复）
# 部署位置：/etc/nginx/conf.d/jiaru-proxy.conf
# 由 jiaru.conf 在各 location 内 include 引用，不单独生效。

proxy_http_version 1.1;

# ── 来源头：由 Nginx 覆盖，杜绝客户端伪造 ──
# 应用层仅在 JIARU_TRUST_PROXY=1 时采信这两个头：
#   X-Real-IP       = $remote_addr（TCP 对端，不可伪造）
#   X-Forwarded-For = 追加式，真实客户端位于最右侧
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

# WebSocket / RSC 流式响应需要
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;

# ── 超时：两个生图路由 maxDuration=300s，必须大于该值 ──
proxy_connect_timeout 10s;
proxy_send_timeout    320s;
proxy_read_timeout    320s;

# 关闭缓冲，避免长任务被缓冲策略拖成假超时
proxy_buffering off;

# 参考图以 Data URI 提交，单请求可达 9MB
client_max_body_size 12m;

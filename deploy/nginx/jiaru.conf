# JiaRu Nginx 反向代理主配置（2026-09-24 安全审计修复）
#
# 部署位置：/etc/nginx/conf.d/jiaru.conf
# 生效方式：nginx -t && systemctl reload nginx
#
# 背景：此前应用直接以 0.0.0.0:3000 暴露公网，没有反向代理、没有 TLS、
#       没有任何代理层限流。本配置把 3000 收回本机，由 Nginx 统一对外。
#
# 要点：
#  1. 限流按 $binary_remote_addr（TCP 对端），不受伪造 XFF 影响；
#     应用层另有一份进程内限流，这里再加一道；
#  2. 由 Nginx 覆盖 X-Forwarded-For 并注入 X-Real-IP=$remote_addr，
#     应用层须设置 JIARU_TRUST_PROXY=1 才会采信；
#  3. 安全响应头在此统一注入（应用层 next.config.ts 亦有一份，覆盖动态响应）；
#  4. HSTS 只在 443 + 证书生效后开启，80 端口不得发送；
#  5. 生图路由 maxDuration=300s，proxy_read_timeout 必须更大（见 proxy 片段）。

# ── 限流区 ──
limit_req_zone $binary_remote_addr zone=jiaru_auth:10m     rate=10r/m;
limit_req_zone $binary_remote_addr zone=jiaru_generate:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=jiaru_api:10m      rate=120r/m;

# WebSocket 升级映射（proxy 片段引用）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    add_header X-Content-Type-Options    nosniff always;
    add_header X-Frame-Options           SAMEORIGIN always;
    add_header Referrer-Policy           strict-origin-when-cross-origin always;
    add_header X-DNS-Prefetch-Control    off always;
    add_header Permissions-Policy        "camera=(self), microphone=()" always;

    # 隐藏版本号
    server_tokens off;

    # ── 认证相关：严格限流（验证码轰炸 / 暴力尝试）──
    location /api/auth/ {
        limit_req zone=jiaru_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/conf.d/jiaru-proxy.conf;
    }

    # ── 付费生图接口：并发敏感，单独限流 ──
    location /api/generate-ai {
        limit_req zone=jiaru_generate burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/conf.d/jiaru-proxy.conf;
    }

    location /api/generate-seedream {
        limit_req zone=jiaru_generate burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/conf.d/jiaru-proxy.conf;
    }

    # ── 其余 API ──
    location /api/ {
        limit_req zone=jiaru_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/conf.d/jiaru-proxy.conf;
    }

    # ── 页面与静态资源：不做限流，避免误伤正常访问 ──
    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/conf.d/jiaru-proxy.conf;
    }
}

